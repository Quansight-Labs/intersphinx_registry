[build-system]
requires = ["flit_core >=3.12.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "intersphinx_registry"
authors = [{name = "M Bussonnier", email = "bussonniermatthias@gmail.com"}]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
readme = "README.md"

[project.optional-dependencies]
tests = ["pytest>=9.0.3", "mypy", "types-requests",'intersphinx_registry[cli]']
lookup = ["sphinx>=9.1.0", "requests", "requests-cache", "platformdirs"]
cli = ["intersphinx_registry[lookup]"]

[project.scripts]
intersphinx-registry = "intersphinx_registry.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
# Network tests are filtered through link-check-proxy (tests/conftest.py), so
# few live requests remain and xdist is no longer needed. `-p no:asyncio`
# silences pytest-asyncio's config deprecation when it happens to be installed.
addopts = ["-p", "no:asyncio", "--strict-config", "--strict-markers", "-ra", "--durations=10"]
filterwarnings = ["error"]
log_cli_level = "INFO"
testpaths = ["tests"]
xfail_strict = true

[tool.mypy]
files = ["intersphinx_registry", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["intersphinx_registry"]

[project.urls]
Home = "https://github.com/Quansight-labs/intersphinx_registry"
