name: "CD"

on:
  push:
    tags:
      - "[0-9]*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (usually a tag) to build and publish"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (usually a tag) to build and publish"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: "publish"
  cancel-in-progress: true

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/intersphinx_registry
    permissions:
      id-token: write # for publishing to PyPI
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_call, build the ref the caller just tagged. On a tag
          # push, the default checkout is already that tag.
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
